<!DOCTYPE html>
<html>

<head>

<title>Untold Story</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="passwordPage">


<div class="passwordBox">


<div class="lock">
🔐
</div>


<h1>
A Secret Chapter Awaits...
</h1>


<p id="status">
Enter your code...
</p>


<input 
id="secretKey"
type="password"
placeholder="Enter your secret code"
>


<button onclick="unlock()">
✨ Unlock
</button>



<div id="message"></div>


</div>

</div>






<!-- DISCLAIMER -->


<div id="disclaimer">


<div class="gardenSpark"></div>


<div class="flowers">

<span>🌸</span>
<span>✨</span>
<span>🌸</span>

</div>



<div class="orangeLayer">

<span>🍊</span>
<span>🍊</span>
<span>🍊</span>

</div>



<div class="disclaimerContent">


<h2 id="disTitle"></h2>


<p id="disText"></p>



<button onclick="continueStory()">

✨ Continue The Story

</button>


</div>



</div>








<script>



function unlock(){



let key=document.getElementById("secretKey").value;


let lock=document.querySelector(".lock");

let box=document.querySelector(".passwordBox");

let status=document.getElementById("status");

let message=document.getElementById("message");




if(key==="NS26612172"){



document.getElementById("secretKey").style.display="none";


document.querySelector("button").style.display="none";



lock.classList.add("fadeLock");


box.classList.add("celebrate");



setTimeout(()=>{


status.style.display="none";


showHeartMessage();



},1200);



}

else{


box.classList.add("wrong");


status.innerHTML="🔒 Wrong Code";


setTimeout(()=>{

box.classList.remove("wrong");

},800);


}



}








function showHeartMessage(){



let message=document.getElementById("message");


message.innerHTML="";



let lines=[


"Ohh myy cuite crushuuuu 💗",

"Your code is accepted... ✨",

"Now you can access my <span class='beatHeart'>❤️</span> heartuuu"


];


let i=0;



function reveal(){


if(i<lines.length){


let text=document.createElement("div");


text.innerHTML=lines[i];


text.className="revealLine";


message.appendChild(text);


i++;


setTimeout(reveal,900);



}


}



reveal();




setTimeout(()=>{


message.style.opacity="0";


setTimeout(()=>{


showSecondMessage();


},1500);



},8500);



}







function showSecondMessage(){



let message=document.getElementById("message");


message.style.opacity="1";


message.innerHTML="";



message.innerHTML=

"Sorry... not heartuuu 💗<br><br>"+
"Now you can access<br>"+
"what my mind hidden from you...";



setTimeout(()=>{


showDisclaimer();



},7000);



}








function showDisclaimer(){



let dis=document.getElementById("disclaimer");


dis.style.display="flex";


setTimeout(()=>{


dis.style.opacity="1";



typeWriter(

document.getElementById("disTitle"),

"✨ A Little Disclaimer ✨"

);



setTimeout(()=>{


typeWriter(

document.getElementById("disText"),

"Before you continue... If anything here makes you smile, surprises you, or feels unexpected, please don't blame me. 😄 It is all because of that silly little mind of mine. So if something feels too much, blame my imagination... Not me. ✨"

);



},1500);



},300);



}








function typeWriter(element,text){



element.innerHTML="";


let words=text.split(" ");


let i=0;



let timer=setInterval(()=>{


element.innerHTML += words[i]+" ";


i++;


if(i>=words.length){

clearInterval(timer);

}


},180);



}








function continueStory(){



document.getElementById("disclaimer").style.opacity="0";



setTimeout(()=>{


window.location.href="eyes.html";


},1500);



}



</script>



</body>

</html>
